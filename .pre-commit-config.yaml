exclude: ".*/(data|docs/experimental)/.*"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
repos:
# Relax this rule for now because it creates too many PRs conflicts.
# A GH actions will checkout this weekly instead
# -   repo: https://gitlab.com/vojko.pribudic.foss/pre-commit-update
#     rev: v0.7.0
#     hooks:
#     -   id: pre-commit-update
#         args: [--keep, pre-commit-update]
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: mixed-line-ending
        args: ['--fix=lf']
    -   id: check-yaml
    -   id: check-json
    -   id: check-toml
    -   id: check-added-large-files
    -   id: check-case-conflict
    -   id: check-merge-conflict
    -   id: check-vcs-permalinks
    -   id: detect-aws-credentials
        args: [--allow-missing-credentials]
    -   id: detect-private-key
-   repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
    -   id: codespell
        additional_dependencies:
        -   tomli
-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.1
    hooks:
    -   id: mypy
        # Sync with project.optional-dependencies.typing
        additional_dependencies:
        -   pytest
        -   types-setuptools
        -   types-Pillow
        -   pydicom
        -   numpy
        -   pyzstd
        -   importlib_resources
        args: ["fury"]
        pass_filenames: false
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      # Run the linter
    -   id: ruff-check
        args: ["--fix", "--show-fixes"]
      # Run the formatter
    -   id: ruff-format
-   repo: https://github.com/numpy/numpydoc
    rev: v1.11.0
    hooks:
    -   id: numpydoc-validation
        exclude: |
          (?x)(
              /tests/|
              docs/|
              fury/conftest.py
          )
-   repo: local
    hooks:
    -   id: generate_requirements.py
        name: generate_requirements.py
        language: system
        entry: python tools/generate_requirements.py
        files: "pyproject.toml|requirements/.*\\.txt|tools/generate_requirements.py"
    -   id: enforce-pep3102-defaults
        name: Enforce keyword-only default arguments (PEP 3102)
        entry: python tools/check_pep3102.py
        language: python
        types: [python]
        # docs/ and tests are exempt, as in DIPY.
        exclude: |
          (?x)^(
            docs/|
            fury/(.*/)?tests/
          )
    -   id: fury-commit-msg
        name: fury-commit-msg
        entry: python tools/hooks/commit-msg.py
        language: python
        stages: [commit-msg]
